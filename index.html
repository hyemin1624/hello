<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>애니메이션 굿즈 및 피규어샵 지도</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- 구글 폰트 (Pretendard 스타일) -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- 카카오맵 JavaScript SDK 로드 (autoload=false) -->
    <script type="text/javascript" src="//dapi.kakao.com/v2/maps/sdk.js?appkey=7dc4b6e17f706b35e52af0bb2e9c56e5&libraries=services&autoload=false"></script>
    <style>
        body { font-family: 'Noto Sans KR', sans-serif; }
        /* 스크롤바 디자인 */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #f8fafc; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
    </style>
</head>
<body class="bg-slate-100 h-screen flex flex-col overflow-hidden text-slate-800">

    <!-- 상단 헤더 -->
    <header class="bg-slate-900 text-white shadow-lg px-6 py-4 flex items-center justify-between z-20 border-b border-slate-800">
        <div class="flex items-center gap-3">
            <div class="w-9 h-9 rounded-xl bg-slate-800 border border-slate-700 flex items-center justify-center shadow-inner text-base">
                🗺️
            </div>
            <div>
                <h1 class="text-base font-bold tracking-tight">덕질 지도 아카이브</h1>
                <p class="text-xs text-slate-400">지역별 굿즈샵 & 피규어 전문점 탐색기</p>
            </div>
        </div>
        <div class="text-xs bg-slate-800 border border-slate-700 px-3 py-1.5 rounded-full text-slate-300 flex items-center gap-1.5 shadow-inner">
            <span class="w-2 h-2 rounded-full bg-emerald-400"></span>
            준비 완료
        </div>
    </header>

    <!-- 메인 컨테이너 (2분할 레이아웃) -->
    <main class="flex-1 flex flex-col md:flex-row overflow-hidden">
        
        <!-- 왼쪽: 탭 메뉴, 지역 검색창 및 결과 리스트 영역 -->
        <section class="w-full md:w-[420px] bg-white border-r border-slate-200 flex flex-col z-10 shadow-xl">
            
            <!-- 탭 버튼 영역 -->
            <div class="flex border-b border-slate-200 bg-slate-50/70 p-2 gap-2">
                <button 
                    id="tab-figure" 
                    onclick="switchTab('figure')" 
                    class="flex-1 py-2.5 px-4 text-xs font-bold rounded-xl bg-slate-900 text-white shadow-sm transition-all flex items-center justify-center gap-1.5"
                >
                    <span>🛡️</span> 피규어 전문샵
                </button>
                <button 
                    id="tab-goods" 
                    onclick="switchTab('goods')" 
                    class="flex-1 py-2.5 px-4 text-xs font-semibold rounded-xl text-slate-600 hover:bg-slate-200/60 transition-all flex items-center justify-center gap-1.5"
                >
                    <span>🎁</span> 애니 굿즈샵
                </button>
            </div>

            <!-- 지역 검색 입력폼 -->
            <div class="p-4 border-b border-slate-100 bg-white">
                <form id="search-form" class="flex gap-2">
                    <div class="relative flex-1">
                        <input 
                            type="text" 
                            id="search-input" 
                            placeholder="지역 검색 (예: 홍대, 국제전자센터, 부산 서면)" 
                            class="w-full pl-9 pr-3 py-2.5 bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-slate-900/10 focus:border-slate-900 text-xs transition"
                            required
                        >
                        <span class="absolute left-3 top-3 text-slate-400 text-xs">📍</span>
                    </div>
                    <button 
                        type="submit" 
                        class="bg-slate-900 hover:bg-slate-800 text-white px-4 py-2.5 rounded-xl text-xs font-semibold transition shadow-sm"
                    >
                        지역검색
                    </button>
                </form>
            </div>

            <!-- 검색 결과 리스트 헤더 -->
            <div class="px-4 py-2.5 bg-slate-50 border-b border-slate-100 flex justify-between items-center text-xs text-slate-500 font-medium">
                <span id="result-count">탐색 결과 (0개)</span>
                <span class="text-[11px] text-slate-400">거리순 정렬</span>
            </div>

            <!-- 검색 결과 리스트 -->
            <div id="place-list" class="flex-1 overflow-y-auto divide-y divide-slate-100">
                <div class="p-12 text-center text-slate-400 text-xs">
                    <div class="w-10 h-10 mx-auto mb-3 rounded-full bg-slate-100 flex items-center justify-center text-base">🔍</div>
                    원하는 지역을 검색해 보세요!<br>(예: 홍대, 국전 등)
                </div>
            </div>
        </section>

        <!-- 오른쪽: 지도 영역 -->
        <section class="flex-1 relative">
            <div id="map" class="w-full h-full"></div>
        </section>
    </main>

    <!-- JavaScript 로직 -->
    <script>
        // 전역 변수 설정
        let map = null;
        let ps = null;
        let geocoder = null;
        let infowindow = null;
        let markers = [];
        let currentCategory = 'figure'; // 현재 선택된 탭 ('figure' 또는 'goods')
        let lastLat = 37.566826; // 마지막 중심 위도 (기본: 서울 시청)
        let lastLng = 126.978656; // 마지막 중심 경도 (기본: 서울 시청)

        // 카카오맵 SDK 로드 완료 후 실행
        kakao.maps.load(function() {
            const container = document.getElementById('map');
            const options = {
                center: new kakao.maps.LatLng(lastLat, lastLng), // 서울 시청 중심
                level: 5 // 요구 조건: 지도 확대 레벨 5
            };

            // 지도 생성
            map = new kakao.maps.Map(container, options);
            ps = new kakao.maps.services.Places();
            geocoder = new kakao.maps.services.Geocoder();
            infowindow = new kakao.maps.InfoWindow({ zIndex: 1 });

            // 검색 폼 이벤트 연결
            const searchForm = document.getElementById('search-form');
            searchForm.addEventListener('submit', function(e) {
                e.preventDefault();
                searchByRegion();
            });

            // 실행 시 기본적으로 서울 시청 주변 피규어샵 검색 수행
            searchShops(lastLat, lastLng, '피규어샵');
        });

        // 탭 변경 처리 함수
        function switchTab(categoryType) {
            currentCategory = categoryType;
            
            const btnFigure = document.getElementById('tab-figure');
            const btnGoods = document.getElementById('tab-goods');

            if (categoryType === 'figure') {
                btnFigure.className = "flex-1 py-2.5 px-4 text-xs font-bold rounded-xl bg-slate-900 text-white shadow-sm transition-all flex items-center justify-center gap-1.5";
                btnGoods.className = "flex-1 py-2.5 px-4 text-xs font-semibold rounded-xl text-slate-600 hover:bg-slate-200/60 transition-all flex items-center justify-center gap-1.5";
                searchShops(lastLat, lastLng, '피규어샵');
            } else {
                btnGoods.className = "flex-1 py-2.5 px-4 text-xs font-bold rounded-xl bg-slate-700 text-white shadow-sm transition-all flex items-center justify-center gap-1.5";
                btnFigure.className = "flex-1 py-2.5 px-4 text-xs font-semibold rounded-xl text-slate-600 hover:bg-slate-200/60 transition-all flex items-center justify-center gap-1.5";
                searchShops(lastLat, lastLng, '애니메이션 굿즈샵');
            }
        }

        // 사용자가 입력한 지역명을 검색하는 함수
        function searchByRegion() {
            const keyword = document.getElementById('search-input').value.trim();
            if (!keyword) return;

            document.getElementById('place-list').innerHTML = `
                <div class="p-12 text-center text-slate-400 text-xs">
                    <div class="inline-block w-6 h-6 border-2 border-slate-800 border-t-transparent rounded-full animate-spin mb-2"></div>
                    <p>지역을 찾는 중입니다...</p>
                </div>`;

            // 주소로 좌표 검색
            geocoder.addressSearch(keyword, function(result, status) {
                if (status === kakao.maps.services.Status.OK) {
                    lastLat = result[0].y;
                    lastLng = result[0].x;
                    moveAndSearch(lastLat, lastLng);
                } else {
                    // 주소 검색 안 되면 키워드로 장소 검색 시도
                    ps.keywordSearch(keyword, function(data, status) {
                        if (status === kakao.maps.services.Status.OK) {
                            lastLat = data[0].y;
                            lastLng = data[0].x;
                            moveAndSearch(lastLat, lastLng);
                        } else {
                            alert('해당 지역을 찾을 수 없습니다.');
                            document.getElementById('place-list').innerHTML = `
                                <div class="p-12 text-center text-slate-400 text-xs">검색 결과가 없습니다.</div>`;
                        }
                    });
                }
            });
        }

        // 해당 좌표로 지도를 이동하고 현재 탭에 맞는 샵 검색
        function moveAndSearch(lat, lng) {
            const moveLatLon = new kakao.maps.LatLng(lat, lng);
            map.setCenter(moveLatLon);
            map.setLevel(5); // 요구 조건: 지도 확대 레벨 5

            const shopKeyword = currentCategory === 'figure' ? '피규어샵' : '애니메이션 굿즈샵';
            searchShops(lat, lng, shopKeyword);
        }

        // 특정 좌표 기준 주변 샵 검색 실행
        function searchShops(lat, lng, keyword) {
            removeMarkers();

            const searchCenter = new kakao.maps.LatLng(lat, lng);
            const searchOptions = {
                location: searchCenter,
                radius: 5000, // 5km 반경
                sort: kakao.maps.services.SortBy.DISTANCE // 가까운 순
            };

            ps.keywordSearch(keyword, function(data, status) {
                if (status === kakao.maps.services.Status.OK) {
                    // 미술학원, 교습소 등 제외 필터링
                    const filteredData = data.filter(place => {
                        const name = place.place_name;
                        const category = place.category_name || '';
                        const exclude = ['교습소', '학원', '미술', '입시', '교육', '어학'];
                        return !exclude.some(ex => name.includes(ex) || category.includes(ex));
                    });

                    if (filteredData.length > 0) {
                        document.getElementById('result-count').textContent = `탐색 결과 (${filteredData.length}개)`;
                        displayPlaces(filteredData);
                    } else {
                        showNoResult();
                    }
                } else {
                    showNoResult();
                }
            }, searchOptions);
        }

        // 검색 결과 없을 때
        function showNoResult() {
            document.getElementById('result-count').textContent = `탐색 결과 (0개)`;
            document.getElementById('place-list').innerHTML = `
                <div class="p-12 text-center text-slate-400 text-xs">
                    <p class="text-base mb-1">😢</p>
                    주변에 전문샵이 없습니다.<br>다른 지역을 검색해 보세요!
                </div>`;
            removeMarkers();
        }

        // 검색된 장소 목록과 마커 렌더링
        function displayPlaces(places) {
            const listEl = document.getElementById('place-list');
            listEl.innerHTML = ''; 
            removeMarkers(); 

            const bounds = new kakao.maps.LatLngBounds();

            places.forEach((place, index) => {
                const placePosition = new kakao.maps.LatLng(place.y, place.x);
                const marker = addCustomMarker(placePosition, currentCategory);
                const itemEl = getListItem(place);

                bounds.extend(placePosition);

                // 마커 및 리스트 클릭 이벤트
                kakao.maps.event.addListener(marker, 'click', function() {
                    displayInfowindow(marker, place);
                });

                itemEl.addEventListener('click', function() {
                    map.setCenter(marker.getPosition());
                    displayInfowindow(marker, place);
                });

                listEl.appendChild(itemEl);
            });

            map.setBounds(bounds);
        }

        // 리스트 아이템 HTML 생성
        function getListItem(place) {
            const el = document.createElement('div');
            el.className = 'p-4 hover:bg-slate-50 cursor-pointer transition-all border-b border-slate-100 group';
            
            let html = `
                <div class="flex items-start justify-between gap-2">
                    <h5 class="font-bold text-slate-800 text-xs group-hover:text-slate-900 transition">${place.place_name}</h5>
                    <span class="text-[10px] bg-slate-100 text-slate-500 px-1.5 py-0.5 rounded-md font-medium">전문샵</span>
                </div>
            `;

            if (place.road_address_name) {
                html += `<p class="text-[11px] text-slate-600 mt-1">도로명: ${place.road_address_name}</p>`;
            }
            html += `<p class="text-[11px] text-slate-400 mt-0.5">지번: ${place.address_name}</p>`;
            
            if (place.phone) {
                html += `<p class="text-[11px] text-slate-700 mt-1 font-medium flex items-center gap-1"><span>📞</span> ${place.phone}</p>`;
            }

            el.innerHTML = html;
            return el;
        }

        // 숫자가 없는 깔끔한 단색 원형 마커 생성
        function addCustomMarker(position, category) {
            const bgColor = category === 'figure' ? '#0f172a' : '#334155';
            
            const markerContent = document.createElement('div');
            markerContent.innerHTML = `
                <div style="
                    width: 16px;
                    height: 16px;
                    background-color: ${bgColor};
                    border: 3px solid #ffffff;
                    border-radius: 50%;
                    box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.2);
                    cursor: pointer;
                "></div>
            `;

            const customOverlay = new kakao.maps.CustomOverlay({
                position: position,
                content: markerContent,
                yAnchor: 0.5,
                xAnchor: 0.5
            });

            customOverlay.setMap(map);
            markers.push(customOverlay);

            return customOverlay;
        }

        // 기존 마커 제거
        function removeMarkers() {
            markers.forEach(marker => marker.setMap(null));
            markers = [];
        }

        // 인포윈도우 상세 팝업 표시
        function displayInfowindow(marker, place) {
            const addressText = place.road_address_name ? place.road_address_name : place.address_name;
            const content = `
                <div style="padding:12px;font-size:12px;line-height:1.5;min-width:180px;font-family:'Noto Sans KR',sans-serif;">
                    <span style="font-weight:bold;color:#0f172a;display:block;margin-bottom:4px;font-size:13px;">📍 ${place.place_name}</span>
                    <span style="color:#475569;display:block;font-size:11px;">🏠 ${addressText}</span>
                    ${place.phone ? `<span style="color:#334155;display:block;margin-top:4px;font-size:11px;font-weight:500;">📞 ${place.phone}</span>` : ''}
                </div>`;
            
            infowindow.setContent(content);
            infowindow.open(map, marker);
        }
    </script>
</body>
</html>
